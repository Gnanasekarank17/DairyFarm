# Local override:
#  - publish the API on host port 8080 (host 3000 is used by the nodemon dev server)
#  - add a static web UI (nginx) serving the Expo web export on host port 8090
# The `!override` tag replaces the base `ports` list instead of appending to it.
services:
  dairy-api:
    ports: !override
      - "8080:3000"

  dairy-web:
    image: nginx:alpine
    container_name: dairy-farm-web
    restart: unless-stopped
    depends_on:
      - dairy-api
    ports:
      - "8090:80"
    volumes:
      - ./mobile/dist:/usr/share/nginx/html:ro
      - ./mobile/nginx-web.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

