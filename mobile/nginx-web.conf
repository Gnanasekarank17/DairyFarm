server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo static export produces per-route .html files plus client-side routing.
    # Try the exact file, then <route>.html, then a directory, then fall back to index.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Long-cache the hashed static assets.
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
